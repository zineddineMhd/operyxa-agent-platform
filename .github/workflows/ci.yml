name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: operyxa, POSTGRES_PASSWORD: operyxa, POSTGRES_DB: operyxa_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U operyxa" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://operyxa:operyxa@localhost:5432/operyxa_test
      DATABASE_URL: postgresql+psycopg://operyxa:operyxa@localhost:5432/operyxa_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests alembic
      - run: uv run ruff format --check src tests alembic
      - name: Migrations apply and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q
