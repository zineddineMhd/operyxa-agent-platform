# Whole platform on one machine: docker compose -f infrastructure/compose.yml up -d --build
# Interface: http://localhost:8080 (API docs: http://localhost:8000/docs).
# Redis is intentionally absent from the MVP: PostgreSQL is the queue and the event log.
x-backend: &backend
  build: ../backend
  env_file: [{path: ../.env, required: false}]
  environment:
    DATABASE_URL: postgresql+psycopg://operyxa:operyxa@postgres:5432/operyxa
  restart: unless-stopped
  depends_on:
    migrate: {condition: service_completed_successfully}

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: operyxa, POSTGRES_PASSWORD: operyxa, POSTGRES_DB: operyxa}
    volumes: [pgdata:/var/lib/postgresql/data]
    # Reachable from this computer only.
    ports: ["127.0.0.1:5432:5432"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operyxa"]
      interval: 3s
      retries: 20

  migrate:
    build: ../backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://operyxa:operyxa@postgres:5432/operyxa
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      retries: 20

  worker:
    <<: *backend
    command: python -m operyxa.worker

  web:
    build: ../web
    ports: ["127.0.0.1:8080:80"]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
